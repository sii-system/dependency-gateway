services:
  gateway:
    build:
      context: ..
    env_file:
      - ../config.local.env
    environment:
      DEPENDENCY_GATEWAY_STORAGE: s3
      DEPENDENCY_GATEWAY_CONFIG: /app/config/sources.json
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - dependency-gateway-work:/data/dependency-gateway
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  dependency-gateway-work:
