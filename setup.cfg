[metadata]
name = dependency-gateway
version = 0.2.0
description = A small, source-configurable HTTP dependency gateway
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages =
    dependency_gateway
    dependency_gateway.cli
    dependency_gateway.core
    dependency_gateway.core.config
    dependency_gateway.core.ecosystems
    dependency_gateway.gateway
    dependency_gateway.gateway.engine
    dependency_gateway.gateway.services
    dependency_gateway.harbor_tasks
    dependency_gateway.harbor_tasks.analyzer
    dependency_gateway.harbor_tasks.preparer
    dependency_gateway.harbor_tasks.preparer.direct_download
    dependency_gateway.harbor_tasks.preparer.providers
    dependency_gateway.harbor_tasks.preparer.providers.apt
    dependency_gateway.harbor_tasks.preparer.providers.pip
    dependency_gateway.storage
    dependency_gateway.ui
package_dir =
    dependency_gateway = src
python_requires = >=3.10
include_package_data = True
install_requires =
    boto3==1.26.134

[options.package_data]
dependency_gateway.harbor_tasks.preparer.providers =
    npm_resolver.js
dependency_gateway.harbor_tasks.preparer.providers.apt =
    resolver_script.sh
dependency_gateway.harbor_tasks.preparer.providers.pip =
    resolver_script.py
dependency_gateway.ui =
    static/index.html
    static/styles.css
    static/app.js
    static/README.md

[options.entry_points]
console_scripts =
    dependency-gateway = dependency_gateway.cli.main:main
    dependency-gateway-prepare = dependency_gateway.harbor_tasks.preparer.cli:main
    dependency-gateway-inventory = dependency_gateway.cli.inventory:main
    dependency-gateway-stats = dependency_gateway.cli.stats:main
